# Configuración del tema visual de Streamlit.
#
# Estos valores definen la paleta y la tipografía de toda la app.
# Se aplican automáticamente al arrancar Streamlit. Si querés
# cambiar el look general, este es el primer lugar para tocar.

[theme]
# La apariencia predeterminada del producto es oscura y coincide con la paleta CSS.
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
font = "sans serif"

[client]
# Reduce las opciones de desarrollo de Streamlit en la interfaz de uso.
# Las funciones de trabajo viven en la navegación de la aplicación.
toolbarMode = "minimal"

[server]
# Headless evita que Streamlit intente abrir un navegador
# automáticamente y deja que vos lo abras cuando quieras.
headless = true
port = 8501

[browser]
# No recolectar estadísticas de uso.
gatherUsageStats = false