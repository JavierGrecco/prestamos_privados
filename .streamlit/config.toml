# Configuración visual de Préstamos Privados.
# La experiencia predeterminada es oscura; la aplicación mantiene un selector
# propio para claro/intermedio cuando el usuario lo necesita.

[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111B2E"
textColor = "#F1F5F9"
font = "sans serif"

[server]
# Headless evita que Streamlit intente abrir el navegador automáticamente.
headless = true
port = 8501

[client]
# Oculta Deploy y las opciones de desarrollador de la barra de Streamlit.
# La interfaz propia ofrece únicamente controles útiles para la operación.
toolbarMode = "minimal"

[browser]
# No recolectar estadísticas de uso.
gatherUsageStats = false
