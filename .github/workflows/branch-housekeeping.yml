name: branch housekeeping

on:
  push:
    branches: ["main"]
  pull_request:
    types: [closed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo listar las ramas candidatas. Desactivarlo ejecuta el borrado."
        type: boolean
        required: true
        default: true
      include_superseded:
        description: "Incluir PR cerradas con evidencia explícita de sustitución o consolidación en otra integrada."
        type: boolean
        required: true
        default: false
      include_ancestors:
        description: "Incluir ramas cuyo HEAD ya está contenido en main (sin commits únicos)."
        type: boolean
        required: true
        default: true
      confirmation:
        description: "Para borrar, escribir exactamente DELETE_MERGED_BRANCHES."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  delete-branch-after-merge:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the merged work branch
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const { owner, repo } = context.repo;
            const fullName = `${owner}/${repo}`;
            if (!branch || branch === pr.base.ref) {
              core.setFailed("Refusing to delete an empty or default branch.");
              return;
            }

            const [branches, openPRs] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, {
                owner, repo, per_page: 100,
              }),
              github.paginate(github.rest.pulls.list, {
                owner, repo, state: "open", per_page: 100,
              }),
            ]);
            const branchRef = branches.find(item => item.name === branch);
            if (!branchRef) {
              core.info(`Branch already absent: ${branch}`);
              return;
            }
            if (branchRef.protected) {
              core.info(`Preserving protected branch: ${branch}`);
              return;
            }
            const usedByAnotherOpenPR = openPRs.some(candidate =>
              candidate.number !== pr.number &&
              candidate.head.ref === branch &&
              candidate.head.repo?.full_name === fullName
            );
            if (usedByAnotherOpenPR) {
              core.info(`Preserving branch still used by another open PR: ${branch}`);
              return;
            }

            async function deleteBranchIfPresent(branchName) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branchName}`,
                });
                return "deleted";
              } catch (deleteError) {
                // A merged branch can disappear between listBranches and deleteRef.
                // Confirm absence before treating a failed delete as harmless.
                try {
                  await github.rest.git.getRef({
                    owner,
                    repo,
                    ref: `heads/${branchName}`,
                  });
                } catch (lookupError) {
                  if (lookupError.status === 404) return "absent";
                  throw new Error(
                    `Delete failed (${deleteError.status ?? "unknown"}): ${deleteError.message}; ` +
                    `could not verify ref (${lookupError.status ?? "unknown"}): ${lookupError.message}`
                  );
                }
                throw deleteError;
              }
            }

            const deletion = await deleteBranchIfPresent(branch);
            if (deletion === "deleted") {
              core.info(`Deleted merged branch: ${branch}`);
            } else {
              core.info(`Branch already absent: ${branch}`);
            }

  prune-integrated-branches-on-main-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete branches already represented in main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const fullName = `${owner}/${repo}`;
            const defaultBranch = context.payload.repository.default_branch;
            const mainSha = context.payload.after;
            if (defaultBranch !== "main") {
              core.setFailed(`Expected main as default branch; found ${defaultBranch}.`);
              return;
            }

            const [branches, pullRequests] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, {
                owner, repo, per_page: 100,
              }),
              github.paginate(github.rest.pulls.list, {
                owner, repo, state: "all", per_page: 100,
              }),
            ]);

            const openHeads = new Set(
              pullRequests
                .filter(pr => pr.state === "open")
                .map(pr => pr.head.ref)
            );
            const prByNumber = new Map(pullRequests.map(pr => [pr.number, pr]));
            const eligible = new Map();

            // Exact HEAD matches from PRs merged into main.
            for (const pr of pullRequests) {
              if (
                pr.merged_at &&
                pr.base.ref === "main" &&
                pr.head.repo?.full_name === fullName
              ) {
                eligible.set(`${pr.head.ref}:${pr.head.sha}`, {
                  branch: pr.head.ref,
                  sha: pr.head.sha,
                  reason: `merged PR #${pr.number}`,
                });
              }
            }

            // Closed branches are eligible only with an explicit superseded notice
            // and a reference to another PR that has actually been merged into main.
            for (const pr of pullRequests) {
              if (
                pr.state !== "closed" ||
                pr.merged_at ||
                pr.head.repo?.full_name !== fullName ||
                !/Cerrado como sustituido, no descartado|se cierra como supersedido por la consolidación integrada/i.test(pr.body || "")
              ) {
                continue;
              }
              const references = [...(pr.body || "").matchAll(/PR\s*#(\d+)/gi)]
                .map(match => Number(match[1]));
              const integratedReference = references
                .map(number => prByNumber.get(number))
                .find(candidate =>
                  candidate &&
                  candidate.merged_at &&
                  candidate.base.ref === "main"
                );
              if (integratedReference) {
                eligible.set(`${pr.head.ref}:${pr.head.sha}`, {
                  branch: pr.head.ref,
                  sha: pr.head.sha,
                  reason: `closed PR #${pr.number}, explicitly superseded by merged PR #${integratedReference.number}`,
                });
              }
            }

            const candidates = [];
            const failures = [];
            for (const branch of branches) {
              if (
                branch.name === defaultBranch ||
                branch.protected ||
                openHeads.has(branch.name)
              ) {
                continue;
              }
              const exact = eligible.get(`${branch.name}:${branch.commit.sha}`);
              if (exact) {
                candidates.push(exact);
                continue;
              }

              // A branch whose HEAD is an ancestor of main has no commits or
              // content absent from main. Diverged/ahead branches are preserved.
              try {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${branch.commit.sha}...${mainSha}`,
                });
                if (comparison.data.ahead_by === 0 && ["behind", "identical"].includes(comparison.data.status)) {
                  candidates.push({
                    branch: branch.name,
                    sha: branch.commit.sha,
                    reason: "branch HEAD is already contained in main",
                  });
                }
              } catch (error) {
                if (error.status === 404) {
                  core.warning(`Could not compare ${branch.name}; preserving it.`);
                  continue;
                }
                throw error;
              }
            }

            candidates.sort((a, b) => a.branch.localeCompare(b.branch));
            core.summary
              .addHeading("Safe branch cleanup on main")
              .addTable([
                [{ data: "Default branch", header: true }, { data: defaultBranch }],
                [{ data: "Branches inspected", header: true }, { data: String(branches.length) }],
                [{ data: "Open PR heads preserved", header: true }, { data: String(openHeads.size) }],
                [{ data: "Eligible exact/integrated/ancestor heads", header: true }, { data: String(candidates.length) }],
              ])
              .addTable([
                [
                  { data: "Branch", header: true },
                  { data: "Evidence", header: true },
                ],
                ...candidates.map(candidate => [
                  candidate.branch,
                  candidate.reason,
                ]),
              ]);

            async function deleteBranchIfPresent(branchName) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branchName}`,
                });
                return "deleted";
              } catch (deleteError) {
                try {
                  await github.rest.git.getRef({
                    owner,
                    repo,
                    ref: `heads/${branchName}`,
                  });
                } catch (lookupError) {
                  if (lookupError.status === 404) return "absent";
                  throw new Error(
                    `Delete failed (${deleteError.status ?? "unknown"}): ${deleteError.message}; ` +
                    `could not verify ref (${lookupError.status ?? "unknown"}): ${lookupError.message}`
                  );
                }
                throw deleteError;
              }
            }

            let deleted = 0;
            let alreadyAbsent = 0;
            for (const candidate of candidates) {
              try {
                const outcome = await deleteBranchIfPresent(candidate.branch);
                if (outcome === "deleted") {
                  deleted += 1;
                  core.info(`Deleted ${candidate.branch} (${candidate.reason})`);
                } else {
                  alreadyAbsent += 1;
                  core.info(`Already absent: ${candidate.branch}`);
                }
              } catch (error) {
                const detail = `${candidate.branch}: ${error.status ? `HTTP ${error.status}: ` : ""}${error.message}`;
                failures.push(detail);
                core.error(detail);
              }
            }

            core.summary
              .addHeading("Deletion result")
              .addTable([
                [{ data: "Deleted", header: true }, { data: String(deleted) }],
                [{ data: "Already absent", header: true }, { data: String(alreadyAbsent) }],
                [{ data: "Failures", header: true }, { data: String(failures.length) }],
              ]);
            if (failures.length) {
              core.summary.addList(failures);
              core.setFailed("Some branch deletions failed; inspect the summary.");
            }
            await core.summary.write();

  prune-existing-branches:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Inventory and optionally prune integrated branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const fullName = `${owner}/${repo}`;
            const inputs = context.payload.inputs || {};
            const dryRun = inputs.dry_run === true || inputs.dry_run === "true";
            const includeSuperseded =
              inputs.include_superseded === true ||
              inputs.include_superseded === "true";
            const includeAncestors =
              inputs.include_ancestors === true ||
              inputs.include_ancestors === "true";
            const confirmation = inputs.confirmation || "";
            const defaultBranch = context.payload.repository.default_branch;

            if (defaultBranch !== "main") {
              core.setFailed(`Expected main as default branch; found ${defaultBranch}.`);
              return;
            }
            if (!dryRun && confirmation !== "DELETE_MERGED_BRANCHES") {
              core.setFailed(
                "Deletion refused. Set dry_run=false and type DELETE_MERGED_BRANCHES exactly."
              );
              return;
            }

            const [branches, pullRequests] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, {
                owner, repo, per_page: 100,
              }),
              github.paginate(github.rest.pulls.list, {
                owner, repo, state: "all", per_page: 100,
              }),
            ]);

            const openHeads = new Set(
              pullRequests
                .filter(pr => pr.state === "open")
                .map(pr => pr.head.ref)
            );
            const prByNumber = new Map(pullRequests.map(pr => [pr.number, pr]));
            const eligible = new Map();

            // First choice: the branch head must match a PR actually merged into main.
            for (const pr of pullRequests) {
              if (
                pr.merged_at &&
                pr.base.ref === "main" &&
                pr.head.repo?.full_name === fullName
              ) {
                eligible.set(`${pr.head.ref}:${pr.head.sha}`, {
                  branch: pr.head.ref,
                  sha: pr.head.sha,
                  reason: `merged PR #${pr.number}`,
                });
              }
            }

            // Optional: closed PRs are eligible only when their own body explicitly
            // says they were superseded and names another PR that is now merged into main.
            if (includeSuperseded) {
              for (const pr of pullRequests) {
                if (
                  pr.state !== "closed" ||
                  pr.merged_at ||
                  pr.head.repo?.full_name !== fullName ||
                  !/Cerrado como sustituido, no descartado|se cierra como supersedido por la consolidación integrada/i.test(pr.body || "")
                ) {
                  continue;
                }
                const references = [...(pr.body || "").matchAll(/PR\s*#(\d+)/gi)]
                  .map(match => Number(match[1]));
                const integratedReference = references
                  .map(number => prByNumber.get(number))
                  .find(candidate =>
                    candidate &&
                    candidate.merged_at &&
                    candidate.base.ref === "main"
                  );
                if (integratedReference) {
                  eligible.set(`${pr.head.ref}:${pr.head.sha}`, {
                    branch: pr.head.ref,
                    sha: pr.head.sha,
                    reason: `closed PR #${pr.number}, explicitly superseded by merged PR #${integratedReference.number}`,
                  });
                }
              }
            }

            const candidates = [];
            for (const branch of branches) {
              if (
                branch.name === defaultBranch ||
                branch.protected ||
                openHeads.has(branch.name)
              ) {
                continue;
              }
              const exact = eligible.get(`${branch.name}:${branch.commit.sha}`);
              if (exact) {
                candidates.push(exact);
                continue;
              }
              if (!includeAncestors) continue;
              try {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${branch.commit.sha}...main`,
                });
                if (comparison.data.ahead_by === 0 && ["behind", "identical"].includes(comparison.data.status)) {
                  candidates.push({
                    branch: branch.name,
                    sha: branch.commit.sha,
                    reason: "branch HEAD is already contained in main",
                  });
                }
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
            }
            candidates.sort((a, b) => a.branch.localeCompare(b.branch));

            core.summary
              .addHeading("Branch housekeeping")
              .addTable([
                [{ data: "Mode", header: true }, { data: dryRun ? "DRY RUN" : "DELETE", header: true }],
                [{ data: "Default branch", header: true }, { data: defaultBranch }],
                [{ data: "Branches inspected", header: true }, { data: String(branches.length) }],
                [{ data: "Open PR heads preserved", header: true }, { data: String(openHeads.size) }],
                [{ data: "Eligible branches", header: true }, { data: String(candidates.length) }],
                [{ data: "Include superseded", header: true }, { data: String(includeSuperseded) }],
                [{ data: "Include ancestors of main", header: true }, { data: String(includeAncestors) }],
              ])
              .addTable([
                [
                  { data: "Branch", header: true },
                  { data: "Evidence", header: true },
                  { data: "Result", header: true },
                ],
                ...candidates.map(candidate => [
                  candidate.branch,
                  candidate.reason,
                  dryRun ? "would delete" : "pending",
                ]),
              ]);

            if (dryRun) {
              core.info(`Dry run only. No branches were deleted. ${candidates.length} candidates listed.`);
              await core.summary.write();
              return;
            }

            async function deleteBranchIfPresent(branchName) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branchName}`,
                });
                return "deleted";
              } catch (deleteError) {
                try {
                  await github.rest.git.getRef({
                    owner,
                    repo,
                    ref: `heads/${branchName}`,
                  });
                } catch (lookupError) {
                  if (lookupError.status === 404) return "absent";
                  throw new Error(
                    `Delete failed (${deleteError.status ?? "unknown"}): ${deleteError.message}; ` +
                    `could not verify ref (${lookupError.status ?? "unknown"}): ${lookupError.message}`
                  );
                }
                throw deleteError;
              }
            }

            let deleted = 0;
            let alreadyAbsent = 0;
            const failures = [];
            for (const candidate of candidates) {
              try {
                const outcome = await deleteBranchIfPresent(candidate.branch);
                if (outcome === "deleted") {
                  deleted += 1;
                  core.info(`Deleted ${candidate.branch} (${candidate.reason})`);
                } else {
                  alreadyAbsent += 1;
                  core.info(`Already absent: ${candidate.branch}`);
                }
              } catch (error) {
                const detail = `${candidate.branch}: ${error.status ? `HTTP ${error.status}: ` : ""}${error.message}`;
                failures.push(detail);
                core.error(detail);
              }
            }

            core.summary
              .addHeading("Deletion result")
              .addTable([
                [{ data: "Deleted", header: true }, { data: String(deleted) }],
                [{ data: "Already absent", header: true }, { data: String(alreadyAbsent) }],
                [{ data: "Failures", header: true }, { data: String(failures.length) }],
              ]);
            if (failures.length) {
              core.summary.addList(failures);
              core.setFailed("Some branch deletions failed; inspect the summary.");
            }
            await core.summary.write();
