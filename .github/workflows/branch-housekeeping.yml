name: branch housekeeping

on:
  push:
    branches: ["main"]
  pull_request:
    types: [closed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo listar las ramas candidatas. Desactivarlo ejecuta el borrado."
        type: boolean
        required: true
        default: true
      include_superseded:
        description: "Incluir PR cerradas con evidencia explícita de sustitución o consolidación en otra integrada."
        type: boolean
        required: true
        default: false
      include_ancestors:
        description: "Incluir ramas cuyo HEAD ya está contenido en main (sin commits únicos)."
        type: boolean
        required: true
        default: true
      confirmation:
        description: "Para borrar, escribir exactamente DELETE_MERGED_BRANCHES."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  delete-branch-after-merge:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the merged work branch
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const { owner, repo } = context.repo;
            const fullName = `${owner}/${repo}`;
            if (!branch || branch === pr.base.ref) {
              core.setFailed("Refusing to delete an empty or default branch.");
              return;
            }

            const [branches, openPRs] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, {
                owner, repo, per_page: 100,
              }),
              github.paginate(github.rest.pulls.list, {
                owner, repo, state: "open", per_page: 100,
              }),
            ]);
            if (branch === "archive/legacy-branches-2026-11") {
              core.info("Preserving the historical archive anchor.");
              return;
            }
            const branchRef = branches.find(item => item.name === branch);
            if (!branchRef) {
              core.info(`Branch already absent: ${branch}`);
              return;
            }
            if (branchRef.protected) {
              core.info(`Preserving protected branch: ${branch}`);
              return;
            }
            const usedByAnotherOpenPR = openPRs.some(candidate =>
              candidate.number !== pr.number &&
              candidate.head.ref === branch &&
              candidate.head.repo?.full_name === fullName
            );
            if (usedByAnotherOpenPR) {
              core.info(`Preserving branch still used by another open PR: ${branch}`);
              return;
            }

            async function deleteBranchIfPresent(branchName) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branchName}`,
                });
                return "deleted";
              } catch (deleteError) {
                // A merged branch can disappear between listBranches and deleteRef.
                // Confirm absence before treating a failed delete as harmless.
                try {
                  await github.rest.git.getRef({
                    owner,
                    repo,
                    ref: `heads/${branchName}`,
                  });
                } catch (lookupError) {
                  if (lookupError.status === 404) return "absent";
                  throw new Error(
                    `Delete failed (${deleteError.status ?? "unknown"}): ${deleteError.message}; ` +
                    `could not verify ref (${lookupError.status ?? "unknown"}): ${lookupError.message}`
                  );
                }
                throw deleteError;
              }
            }

            const deletion = await deleteBranchIfPresent(branch);
            if (deletion === "deleted") {
              core.info(`Deleted merged branch: ${branch}`);
            } else {
              core.info(`Branch already absent: ${branch}`);
            }

  prune-integrated-branches-on-main-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete branches already represented in main
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const fullName = `${owner}/${repo}`;
            const defaultBranch = context.payload.repository.default_branch;
            const mainSha = context.payload.after;
            if (defaultBranch !== "main") {
              core.setFailed(`Expected main as default branch; found ${defaultBranch}.`);
              return;
            }

            const [branches, pullRequests] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, {
                owner, repo, per_page: 100,
              }),
              github.paginate(github.rest.pulls.list, {
                owner, repo, state: "all", per_page: 100,
              }),
            ]);

            const openHeads = new Set(
              pullRequests
                .filter(pr => pr.state === "open")
                .map(pr => pr.head.ref)
            );
            const prByNumber = new Map(pullRequests.map(pr => [pr.number, pr]));
            const eligible = new Map();

            // Exact HEAD matches from PRs merged into main.
            for (const pr of pullRequests) {
              if (
                pr.merged_at &&
                pr.base.ref === "main" &&
                pr.head.repo?.full_name === fullName
              ) {
                eligible.set(`${pr.head.ref}:${pr.head.sha}`, {
                  branch: pr.head.ref,
                  sha: pr.head.sha,
                  reason: `merged PR #${pr.number}`,
                });
              }
            }

            // Closed branches are eligible only with an explicit superseded notice
            // and a reference to another PR that has actually been merged into main.
            for (const pr of pullRequests) {
              if (
                pr.state !== "closed" ||
                pr.merged_at ||
                pr.head.repo?.full_name !== fullName ||
                !/Cerrado como sustituido, no descartado|se cierra como supersedido por la consolidación integrada/i.test(pr.body || "")
              ) {
                continue;
              }
              const references = [...(pr.body || "").matchAll(/PR\s*#(\d+)/gi)]
                .map(match => Number(match[1]));
              const integratedReference = references
                .map(number => prByNumber.get(number))
                .find(candidate =>
                  candidate &&
                  candidate.merged_at &&
                  candidate.base.ref === "main"
                );
              if (integratedReference) {
                eligible.set(`${pr.head.ref}:${pr.head.sha}`, {
                  branch: pr.head.ref,
                  sha: pr.head.sha,
                  reason: `closed PR #${pr.number}, explicitly superseded by merged PR #${integratedReference.number}`,
                });
              }
            }

            const candidates = [];
            const failures = [];
            for (const branch of branches) {
              if (
                branch.name === defaultBranch ||
                branch.name === "archive/legacy-branches-2026-11" ||
                branch.protected ||
                openHeads.has(branch.name)
              ) {
                continue;
              }
              const exact = eligible.get(`${branch.name}:${branch.commit.sha}`);
              if (exact) {
                candidates.push(exact);
                continue;
              }

              // A branch whose HEAD is an ancestor of main has no commits or
              // content absent from main. Diverged/ahead branches are preserved.
              try {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${branch.commit.sha}...${mainSha}`,
                });
                if (comparison.data.behind_by === 0 && ["ahead", "identical"].includes(comparison.data.status)) {
                  candidates.push({
                    branch: branch.name,
                    sha: branch.commit.sha,
                    reason: "branch HEAD is already contained in main",
                  });
                }

                // Here the branch is BASE and main is HEAD: its exclusive commits
                // are counted by behind_by. Remove one only when its sole parent is
                // already in main and both trees are identical.
                if (
                  comparison.data.status === "diverged" &&
                  comparison.data.behind_by === 1
                ) {
                  try {
                    const headCommit = await github.rest.git.getCommit({
                      owner,
                      repo,
                      commit_sha: branch.commit.sha,
                    });
                    if (headCommit.data.parents.length === 1) {
                      const parentSha = headCommit.data.parents[0].sha;
                      const parentCommit = await github.rest.git.getCommit({
                        owner,
                        repo,
                        commit_sha: parentSha,
                      });
                      const emptyCommit =
                        headCommit.data.tree.sha === parentCommit.data.tree.sha;
                      if (emptyCommit) {
                        const parentComparison =
                          await github.rest.repos.compareCommitsWithBasehead({
                            owner,
                            repo,
                            basehead: `${parentSha}...${mainSha}`,
                          });
                        const parentIsContained =
                          parentComparison.data.behind_by === 0 &&
                          ["ahead", "identical"].includes(parentComparison.data.status);
                        if (parentIsContained) {
                          candidates.push({
                            branch: branch.name,
                            sha: branch.commit.sha,
                            reason: "single empty commit; parent is already contained in main",
                          });
                        }
                      }
                    }
                  } catch (emptyCommitError) {
                    core.warning(
                      `Could not verify empty-commit ancestry for ${branch.name}; preserving it: ${emptyCommitError.message}`
                    );
                  }
                }
              } catch (error) {
                if (error.status === 404) {
                  core.warning(`Could not compare ${branch.name}; preserving it.`);
                  continue;
                }
                throw error;
              }
            }

            candidates.sort((a, b) => a.branch.localeCompare(b.branch));
            core.summary
              .addHeading("Safe branch cleanup on main")
              .addTable([
                [{ data: "Default branch", header: true }, { data: defaultBranch }],
                [{ data: "Branches inspected", header: true }, { data: String(branches.length) }],
                [{ data: "Open PR heads preserved", header: true }, { data: String(openHeads.size) }],
                [{ data: "Eligible exact/integrated/ancestor heads", header: true }, { data: String(candidates.length) }],
              ])
              .addTable([
                [
                  { data: "Branch", header: true },
                  { data: "Evidence", header: true },
                ],
                ...candidates.map(candidate => [
                  candidate.branch,
                  candidate.reason,
                ]),
              ]);

            async function deleteBranchIfPresent(branchName) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branchName}`,
                });
                return "deleted";
              } catch (deleteError) {
                try {
                  await github.rest.git.getRef({
                    owner,
                    repo,
                    ref: `heads/${branchName}`,
                  });
                } catch (lookupError) {
                  if (lookupError.status === 404) return "absent";
                  throw new Error(
                    `Delete failed (${deleteError.status ?? "unknown"}): ${deleteError.message}; ` +
                    `could not verify ref (${lookupError.status ?? "unknown"}): ${lookupError.message}`
                  );
                }
                throw deleteError;
              }
            }

            let deleted = 0;
            let alreadyAbsent = 0;
            for (const candidate of candidates) {
              try {
                const outcome = await deleteBranchIfPresent(candidate.branch);
                if (outcome === "deleted") {
                  deleted += 1;
                  core.info(`Deleted ${candidate.branch} (${candidate.reason})`);
                } else {
                  alreadyAbsent += 1;
                  core.info(`Already absent: ${candidate.branch}`);
                }
              } catch (error) {
                const detail = `${candidate.branch}: ${error.status ? `HTTP ${error.status}: ` : ""}${error.message}`;
                failures.push(detail);
                core.error(detail);
              }
            }

            // Historical branches are pruned only from a pinned, reviewed manifest.
            // The archive anchor must preserve the exact original main tree and all 14 tips.
            let archivedDeleted = 0;
            let archivedAlreadyAbsent = 0;
            let archivedPreserved = 0;
            let archiveManifestStatus = "not verified";
            try {
              const manifestResponse = await github.rest.repos.getContent({
                owner,
                repo,
                path: "docs/ARCHIVO_RAMAS_HISTORICAS_2026-11.json",
                ref: mainSha,
              });
              if (
                Array.isArray(manifestResponse.data) ||
                manifestResponse.data.encoding !== "base64" ||
                !manifestResponse.data.content
              ) {
                throw new Error("Historical archive manifest is missing or not a base64 file.");
              }
              const manifest = JSON.parse(
                Buffer.from(manifestResponse.data.content, "base64").toString("utf8")
              );
              const names = manifest.branches?.map(item => item.name) ?? [];
              const uniqueNames = new Set(names);
              const validEntries =
                manifest.format_version === 1 &&
                manifest.archive_branch === "archive/legacy-branches-2026-11" &&
                manifest.archive_commit === "0f22a23d4e2dceed7b1a9020d79bc8d75925f378" &&
                manifest.archive_tree_sha === "0ff8027f4f23b0670cb2ef76c868a093e0081ef8" &&
                manifest.base_main_commit === "1192e5d3dca1515ecd0b1baf5ba8284d2e9d4908" &&
                manifest.expected_archived_parent_count === 15 &&
                Array.isArray(manifest.branches) &&
                manifest.branches.length === 14 &&
                uniqueNames.size === 14 &&
                manifest.branches.every(item =>
                  item &&
                  typeof item.name === "string" &&
                  item.name.length > 0 &&
                  item.name !== defaultBranch &&
                  item.name !== manifest.archive_branch &&
                  /^[0-9a-f]{40}$/.test(item.sha)
                );
              if (!validEntries) {
                throw new Error("Historical archive manifest failed its structural or pinned-value checks.");
              }

              const archiveBranch = branches.find(
                item => item.name === manifest.archive_branch
              );
              if (!archiveBranch || archiveBranch.commit.sha !== manifest.archive_commit) {
                throw new Error("Archive branch is absent or does not point to the pinned archive commit.");
              }

              const [archiveCommit, archiveBaseCommit, baseComparison] = await Promise.all([
                github.rest.git.getCommit({
                  owner,
                  repo,
                  commit_sha: manifest.archive_commit,
                }),
                github.rest.git.getCommit({
                  owner,
                  repo,
                  commit_sha: manifest.base_main_commit,
                }),
                github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${manifest.base_main_commit}...${mainSha}`,
                }),
              ]);
              const parentShas = new Set(
                archiveCommit.data.parents.map(parent => parent.sha)
              );
              const expectedParents = [
                manifest.base_main_commit,
                ...manifest.branches.map(item => item.sha),
              ];
              const anchorPreservesAllTips =
                archiveCommit.data.parents.length === manifest.expected_archived_parent_count &&
                archiveCommit.data.tree.sha === manifest.archive_tree_sha &&
                archiveBaseCommit.data.tree.sha === manifest.archive_tree_sha &&
                expectedParents.every(sha => parentShas.has(sha));
              const baseIsStillInMain =
                baseComparison.data.behind_by === 0 &&
                ["ahead", "identical"].includes(baseComparison.data.status);
              if (!anchorPreservesAllTips || !baseIsStillInMain) {
                throw new Error("Archive anchor ancestry/tree verification failed; historical refs are preserved.");
              }

              archiveManifestStatus = "verified";
              for (const archived of manifest.branches) {
                const currentBranch = branches.find(
                  item => item.name === archived.name
                );
                if (!currentBranch) {
                  archivedAlreadyAbsent += 1;
                  core.info(`Archived ref already absent: ${archived.name}`);
                  continue;
                }
                if (
                  currentBranch.name === defaultBranch ||
                  currentBranch.name === manifest.archive_branch ||
                  currentBranch.protected ||
                  openHeads.has(currentBranch.name)
                ) {
                  archivedPreserved += 1;
                  core.warning(`Preserving archived ref in use or protected: ${archived.name}`);
                  continue;
                }

                try {
                  // Re-read the live branch immediately before deletion to avoid
                  // deleting work pushed after this workflow took its inventory.
                  const liveBranch = await github.rest.repos.getBranch({
                    owner,
                    repo,
                    branch: archived.name,
                  });
                  if (liveBranch.data.commit.sha !== archived.sha) {
                    archivedPreserved += 1;
                    core.warning(`Preserving ${archived.name}: HEAD no longer matches the archived SHA.`);
                    continue;
                  }
                  if (liveBranch.data.protected) {
                    archivedPreserved += 1;
                    core.warning(`Preserving ${archived.name}: branch is protected.`);
                    continue;
                  }

                  const archivedComparison = await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: `${archived.sha}...${manifest.archive_commit}`,
                  });
                  const tipIsArchived =
                    archivedComparison.data.behind_by === 0 &&
                    ["ahead", "identical"].includes(archivedComparison.data.status);
                  if (!tipIsArchived) {
                    archivedPreserved += 1;
                    core.warning(`Preserving ${archived.name}: GitHub did not prove its tip is reachable from the archive anchor.`);
                    continue;
                  }

                  const outcome = await deleteBranchIfPresent(archived.name);
                  if (outcome === "deleted") {
                    archivedDeleted += 1;
                    core.info(`Deleted archived historical ref: ${archived.name}`);
                  } else {
                    archivedAlreadyAbsent += 1;
                    core.info(`Archived historical ref already absent: ${archived.name}`);
                  }
                } catch (archiveDeleteError) {
                  if (archiveDeleteError.status === 404) {
                    archivedAlreadyAbsent += 1;
                    core.info(`Archived historical ref disappeared before deletion: ${archived.name}`);
                  } else {
                    archivedPreserved += 1;
                    core.warning(`Could not prove/delete archived ref ${archived.name}; preserving it: ${archiveDeleteError.message}`);
                  }
                }
              }
            } catch (archiveVerificationError) {
              archiveManifestStatus = "not verified; no historical refs removed";
              core.warning(
                `Historical branch archive cleanup skipped: ${archiveVerificationError.message}`
              );
            }

            core.summary
              .addHeading("Historical archive cleanup")
              .addTable([
                [{ data: "Archive manifest", header: true }, { data: archiveManifestStatus }],
                [{ data: "Historical refs deleted", header: true }, { data: String(archivedDeleted) }],
                [{ data: "Already absent", header: true }, { data: String(archivedAlreadyAbsent) }],
                [{ data: "Preserved", header: true }, { data: String(archivedPreserved) }],
              ]);

            core.summary
              .addHeading("Deletion result")
              .addTable([
                [{ data: "Deleted", header: true }, { data: String(deleted) }],
                [{ data: "Already absent", header: true }, { data: String(alreadyAbsent) }],
                [{ data: "Failures", header: true }, { data: String(failures.length) }],
              ]);
            if (failures.length) {
              core.summary.addList(failures);
              core.setFailed("Some branch deletions failed; inspect the summary.");
            }
            await core.summary.write();

  prune-existing-branches:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Inventory and optionally prune integrated branches
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const fullName = `${owner}/${repo}`;
            const inputs = context.payload.inputs || {};
            const dryRun = inputs.dry_run === true || inputs.dry_run === "true";
            const includeSuperseded =
              inputs.include_superseded === true ||
              inputs.include_superseded === "true";
            const includeAncestors =
              inputs.include_ancestors === true ||
              inputs.include_ancestors === "true";
            const confirmation = inputs.confirmation || "";
            const defaultBranch = context.payload.repository.default_branch;

            if (defaultBranch !== "main") {
              core.setFailed(`Expected main as default branch; found ${defaultBranch}.`);
              return;
            }
            if (!dryRun && confirmation !== "DELETE_MERGED_BRANCHES") {
              core.setFailed(
                "Deletion refused. Set dry_run=false and type DELETE_MERGED_BRANCHES exactly."
              );
              return;
            }

            const [branches, pullRequests] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, {
                owner, repo, per_page: 100,
              }),
              github.paginate(github.rest.pulls.list, {
                owner, repo, state: "all", per_page: 100,
              }),
            ]);

            const openHeads = new Set(
              pullRequests
                .filter(pr => pr.state === "open")
                .map(pr => pr.head.ref)
            );
            const prByNumber = new Map(pullRequests.map(pr => [pr.number, pr]));
            const eligible = new Map();

            // First choice: the branch head must match a PR actually merged into main.
            for (const pr of pullRequests) {
              if (
                pr.merged_at &&
                pr.base.ref === "main" &&
                pr.head.repo?.full_name === fullName
              ) {
                eligible.set(`${pr.head.ref}:${pr.head.sha}`, {
                  branch: pr.head.ref,
                  sha: pr.head.sha,
                  reason: `merged PR #${pr.number}`,
                });
              }
            }

            // Optional: closed PRs are eligible only when their own body explicitly
            // says they were superseded and names another PR that is now merged into main.
            if (includeSuperseded) {
              for (const pr of pullRequests) {
                if (
                  pr.state !== "closed" ||
                  pr.merged_at ||
                  pr.head.repo?.full_name !== fullName ||
                  !/Cerrado como sustituido, no descartado|se cierra como supersedido por la consolidación integrada/i.test(pr.body || "")
                ) {
                  continue;
                }
                const references = [...(pr.body || "").matchAll(/PR\s*#(\d+)/gi)]
                  .map(match => Number(match[1]));
                const integratedReference = references
                  .map(number => prByNumber.get(number))
                  .find(candidate =>
                    candidate &&
                    candidate.merged_at &&
                    candidate.base.ref === "main"
                  );
                if (integratedReference) {
                  eligible.set(`${pr.head.ref}:${pr.head.sha}`, {
                    branch: pr.head.ref,
                    sha: pr.head.sha,
                    reason: `closed PR #${pr.number}, explicitly superseded by merged PR #${integratedReference.number}`,
                  });
                }
              }
            }

            const candidates = [];
            for (const branch of branches) {
              if (
                branch.name === defaultBranch ||
                branch.name === "archive/legacy-branches-2026-11" ||
                branch.protected ||
                openHeads.has(branch.name)
              ) {
                continue;
              }
              const exact = eligible.get(`${branch.name}:${branch.commit.sha}`);
              if (exact) {
                candidates.push(exact);
                continue;
              }
              if (!includeAncestors) continue;
              try {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${branch.commit.sha}...main`,
                });
                if (comparison.data.behind_by === 0 && ["ahead", "identical"].includes(comparison.data.status)) {
                  candidates.push({
                    branch: branch.name,
                    sha: branch.commit.sha,
                    reason: "branch HEAD is already contained in main",
                  });
                }
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
            }
            candidates.sort((a, b) => a.branch.localeCompare(b.branch));

            core.summary
              .addHeading("Branch housekeeping")
              .addTable([
                [{ data: "Mode", header: true }, { data: dryRun ? "DRY RUN" : "DELETE", header: true }],
                [{ data: "Default branch", header: true }, { data: defaultBranch }],
                [{ data: "Branches inspected", header: true }, { data: String(branches.length) }],
                [{ data: "Open PR heads preserved", header: true }, { data: String(openHeads.size) }],
                [{ data: "Eligible branches", header: true }, { data: String(candidates.length) }],
                [{ data: "Include superseded", header: true }, { data: String(includeSuperseded) }],
                [{ data: "Include ancestors of main", header: true }, { data: String(includeAncestors) }],
              ])
              .addTable([
                [
                  { data: "Branch", header: true },
                  { data: "Evidence", header: true },
                  { data: "Result", header: true },
                ],
                ...candidates.map(candidate => [
                  candidate.branch,
                  candidate.reason,
                  dryRun ? "would delete" : "pending",
                ]),
              ]);

            if (dryRun) {
              core.info(`Dry run only. No branches were deleted. ${candidates.length} candidates listed.`);
              await core.summary.write();
              return;
            }

            async function deleteBranchIfPresent(branchName) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branchName}`,
                });
                return "deleted";
              } catch (deleteError) {
                try {
                  await github.rest.git.getRef({
                    owner,
                    repo,
                    ref: `heads/${branchName}`,
                  });
                } catch (lookupError) {
                  if (lookupError.status === 404) return "absent";
                  throw new Error(
                    `Delete failed (${deleteError.status ?? "unknown"}): ${deleteError.message}; ` +
                    `could not verify ref (${lookupError.status ?? "unknown"}): ${lookupError.message}`
                  );
                }
                throw deleteError;
              }
            }

            let deleted = 0;
            let alreadyAbsent = 0;
            const failures = [];
            for (const candidate of candidates) {
              try {
                const outcome = await deleteBranchIfPresent(candidate.branch);
                if (outcome === "deleted") {
                  deleted += 1;
                  core.info(`Deleted ${candidate.branch} (${candidate.reason})`);
                } else {
                  alreadyAbsent += 1;
                  core.info(`Already absent: ${candidate.branch}`);
                }
              } catch (error) {
                const detail = `${candidate.branch}: ${error.status ? `HTTP ${error.status}: ` : ""}${error.message}`;
                failures.push(detail);
                core.error(detail);
              }
            }

            core.summary
              .addHeading("Deletion result")
              .addTable([
                [{ data: "Deleted", header: true }, { data: String(deleted) }],
                [{ data: "Already absent", header: true }, { data: String(alreadyAbsent) }],
                [{ data: "Failures", header: true }, { data: String(failures.length) }],
              ]);
            if (failures.length) {
              core.summary.addList(failures);
              core.setFailed("Some branch deletions failed; inspect the summary.");
            }
            await core.summary.write();
